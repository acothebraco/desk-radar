name: Build firmware & deploy web flasher

# Builds the ESP32-S3 firmware, merges it into a single binary, and publishes the
# browser web-flasher (web/flash/) to GitHub Pages so makers can flash from Chrome/Edge.
#
# One-time setup in the repo: Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO + esptool
        run: pip install platformio esptool
        
      - name: Read firmware version from source
        run: |
          VER="$(sed -n 's/^#define FW_VERSION "\([^"]*\)".*/\1/p' src/config.h | head -n 1)"
          test -n "$VER"
          echo "FWVER=$VER" >> "$GITHUB_ENV"
          echo "Building DeskRadar firmware v$VER from src/config.h"
      - name: Test feed and altitude filters
        run: bash tests/run_host_tests.sh

      - name: Check web UI template
        run: python tests/check_web_template.py

      - name: Build firmware
        run: pio run -e esp32-s3-amoled-175

      - name: Merge into a single flashable binary
        run: |
          B=.pio/build/esp32-s3-amoled-175
          BOOT_APP0="$(find "$HOME/.platformio/packages" -name boot_app0.bin -path '*framework-arduinoespressif32*' | head -1)"
          mkdir -p site
          cp web/flash/index.html web/flash/manifest.json site/
          # Stamp with the version actually compiled, not an older git tag.
          VER="$FWVER"
          echo "Webflasher version: $VER"
          sed -i -E "s/__FWVER__/${VER:-dev}/g; s/v[0-9]+\.[0-9]+\.[0-9]+/v${VER:-dev}/g; s/vdev/v${VER:-dev}/g" site/index.html site/manifest.json
          grep -n "Installs firmware" site/index.html
          python -m esptool --chip esp32s3 merge_bin -o site/DeskRadar-esp32s3.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0     "$B/bootloader.bin" \
            0x8000  "$B/partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$B/firmware.bin"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
